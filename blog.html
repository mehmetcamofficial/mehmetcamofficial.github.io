<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="description" content="Mehmet Cam's writing on AI engineering, data science, AgriTech, innovation and technology."><link rel="canonical" href="https://mehmetcamofficial.com.tr/blog.html"><title>Writing & Medium Articles | Mehmet Cam</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/content-pages.css?v=20260921-public4"></head><body><div class="shell"><nav class="nav content-nav" aria-label="Main navigation"><a class="brand" href="/">MC.</a><div class="links"><a href="/">Home</a><a href="/#featured-project">Work</a><a href="/#ai-workflow">AI Workflow</a><a href="/#digital-products">Products</a><a href="/#profile">Research</a><a class="active" href="/blog.html?v=20260921-public3">Writing</a><a href="/#contact">Contact</a></div></nav><header class="hero"><div class="kicker">Writing / Medium</div><h1>Ideas, experiments and field notes.</h1><p>AI engineering, data science, AgriTech, innovation, technology and the thinking behind the systems I build.</p></header><main><div class="writing-list" id="posts"><div class="empty">Loading articles…</div></div></main><footer class="footer">© 2026 Mehmet Cam · Writing & research notes</footer></div><script>
const API="https://mehmetcam-portfolio-ai.aydin254.workers.dev/site-config";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
fetch(API).then(r=>r.json()).then(d=>{const posts=(d.config?.posts||[]).filter(x=>x.enabled!==false&&x.status!=="draft");const box=document.querySelector("#posts");if(!posts.length){box.innerHTML='<div class="empty">No published articles yet.</div>';return}box.innerHTML=posts.map((p,i)=>'<a class="writing-item" href="/post.html?v=20260921-public4&id='+encodeURIComponent(p.id)+'"><div class="writing-thumb">'+(p.image&&p.image!=="#"?'<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'" loading="lazy">':'<div class="article-cover cover-'+(i%6)+'"><span>MEDIUM / WRITING</span><strong>'+esc(p.title)+'</strong></div>')+'</div><div class="writing-copy"><div class="writing-meta">'+esc(p.date||"Medium")+' · Medium</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||"")+'</p><span class="writing-link">Read article →</span></div></a>').join("")}).catch(()=>document.querySelector("#posts").innerHTML='<div class="empty">Articles could not be loaded.</div>');
</script></body></html>
