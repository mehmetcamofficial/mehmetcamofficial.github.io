<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AgriVision AI weed and crop detection</title>
  <desc id="desc">Precision agriculture scene with crop rows and AI detection boxes for crop and weed plants.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a9c4b"/>
      <stop offset="1" stop-color="#3f5d24"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5d3b"/>
      <stop offset="1" stop-color="#5a3525"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0a3a2c" stop-opacity=".78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#052014" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1320" cy="155" r="74" fill="#fff7c2" opacity=".95"/>
  <path d="M0 330 C260 280 420 310 650 275 C900 240 1160 285 1600 230 L1600 900 L0 900 Z" fill="url(#field)"/>
  <path d="M0 505 C250 455 460 470 710 430 C980 385 1200 430 1600 390 L1600 900 L0 900 Z" fill="url(#soil)"/>

  <g opacity=".72">
    <path d="M120 900 L560 452" stroke="#d7b184" stroke-width="38"/>
    <path d="M420 900 L760 430" stroke="#c89566" stroke-width="32"/>
    <path d="M780 900 L955 408" stroke="#d7b184" stroke-width="28"/>
    <path d="M1120 900 L1160 398" stroke="#c89566" stroke-width="24"/>
    <path d="M1450 900 L1350 395" stroke="#d7b184" stroke-width="22"/>
  </g>

  <g fill="#2f7a3d">
    <g transform="translate(250 560)">
      <ellipse cx="0" cy="0" rx="44" ry="18" transform="rotate(-20)"/>
      <ellipse cx="30" cy="18" rx="42" ry="17" transform="rotate(24)"/>
      <ellipse cx="-30" cy="22" rx="38" ry="16" transform="rotate(22)"/>
      <rect x="-4" y="10" width="8" height="65" rx="4" fill="#275d30"/>
    </g>
    <g transform="translate(595 520) scale(.85)">
      <ellipse cx="0" cy="0" rx="44" ry="18" transform="rotate(-20)"/>
      <ellipse cx="30" cy="18" rx="42" ry="17" transform="rotate(24)"/>
      <ellipse cx="-30" cy="22" rx="38" ry="16" transform="rotate(22)"/>
      <rect x="-4" y="10" width="8" height="65" rx="4" fill="#275d30"/>
    </g>
    <g transform="translate(1005 500) scale(.72)">
      <ellipse cx="0" cy="0" rx="44" ry="18" transform="rotate(-20)"/>
      <ellipse cx="30" cy="18" rx="42" ry="17" transform="rotate(24)"/>
      <ellipse cx="-30" cy="22" rx="38" ry="16" transform="rotate(22)"/>
      <rect x="-4" y="10" width="8" height="65" rx="4" fill="#275d30"/>
    </g>
  </g>

  <g fill="#55a83f">
    <g transform="translate(815 650)">
      <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(-35)"/>
      <ellipse cx="25" cy="8" rx="28" ry="11" transform="rotate(28)"/>
      <ellipse cx="-24" cy="10" rx="25" ry="10" transform="rotate(20)"/>
      <rect x="-3" y="5" width="6" height="46" rx="3" fill="#397332"/>
    </g>
    <g transform="translate(1260 615) scale(.86)">
      <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(-35)"/>
      <ellipse cx="25" cy="8" rx="28" ry="11" transform="rotate(28)"/>
      <ellipse cx="-24" cy="10" rx="25" ry="10" transform="rotate(20)"/>
      <rect x="-3" y="5" width="6" height="46" rx="3" fill="#397332"/>
    </g>
  </g>

  <g fill="none" stroke-width="6" filter="url(#shadow)">
    <rect x="158" y="455" width="210" height="220" rx="20" stroke="#00e38c"/>
    <rect x="505" y="438" width="182" height="188" rx="18" stroke="#00e38c"/>
    <rect x="738" y="570" width="164" height="160" rx="18" stroke="#ffcc4d"/>
    <rect x="1195" y="544" width="150" height="152" rx="18" stroke="#ffcc4d"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-weight="800" font-size="30">
    <g>
      <rect x="170" y="468" width="166" height="48" rx="12" fill="#062a20" opacity=".94"/>
      <text x="190" y="501" fill="#7dffc2">CROP 0.94</text>
    </g>
    <g>
      <rect x="515" y="449" width="160" height="48" rx="12" fill="#062a20" opacity=".94"/>
      <text x="534" y="482" fill="#7dffc2">CROP 0.91</text>
    </g>
    <g>
      <rect x="749" y="582" width="144" height="48" rx="12" fill="#3a2d05" opacity=".94"/>
      <text x="768" y="615" fill="#ffe58a">WEED</text>
    </g>
    <g>
      <rect x="1205" y="556" width="132" height="48" rx="12" fill="#3a2d05" opacity=".94"/>
      <text x="1223" y="589" fill="#ffe58a">WEED</text>
    </g>
  </g>

  <g transform="translate(70 70)" filter="url(#shadow)">
    <rect width="560" height="150" rx="32" fill="url(#glass)"/>
    <text x="42" y="65" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">AgriVision AI</text>
    <text x="42" y="112" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#9ef6ca">Precision Agriculture · Computer Vision</text>
  </g>

  <g transform="translate(1220 92)" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="95" cy="78" r="68" fill="#0a2f24" opacity=".9"/>
    <path d="M65 88 C70 55 96 42 125 50 C122 78 104 100 72 109 Z" fill="#63e6a5"/>
    <path d="M92 56 C92 78 88 93 78 106" stroke="#dfffee" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text x="95" y="180" font-size="22" font-weight="800" fill="#0b2d23">AI FIELD VISION</text>
  </g>
</svg>