const API="https://mehmetcam-portfolio-ai.aydin254.workers.dev/site-config",id=new URLSearchParams(location.search).get("id");

</script><script>const t=document.querySelector("#contentThemeToggle");const root=document.documentElement;const saved=localStorage.getItem("theme");if(saved==="dark"){root.dataset.theme="dark";t.textContent="🌙"}t?.addEventListener("click",()=>{const d=root.dataset.theme==="dark";root.dataset.theme=d?"light":"dark";t.textContent=d?"☀️":"🌙";localStorage.setItem("theme",root.dataset.theme)});</script><script>(async()=>{try{let visitorId=localStorage.getItem("mc_portfolio_visitor_id");if(!visitorId){visitorId=crypto.randomUUID();localStorage.setItem("mc_portfolio_visitor_id",visitorId)}await fetch("https://mehmetcam-portfolio-ai.aydin254.workers.dev/visit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({visitorId,path:location.pathname+location.search.slice(0,120)})})}catch{}})();</script></body></html>
