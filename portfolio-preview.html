<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CMS Preview | Mehmet Cam</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/content-pages.css"></head><body><div class="preview-banner">CMS PREVIEW · This is not published</div><div class="shell"><nav class="nav"><a class="brand" href="#">MC.</a><div class="links" id="nav"></div></nav><header class="hero"><div class="kicker" id="badge"></div><h1><span id="lead"></span> <span style="color:var(--accent)" id="accent"></span><br><span id="tail"></span></h1><p id="desc"></p></header><section><div class="kicker">Projects</div><div class="grid" id="projects"></div></section><section style="margin-top:60px"><div class="kicker">Writing</div><div class="grid" id="posts"></div></section><section style="margin-top:60px"><div class="kicker">Experience</div><div class="grid" id="experience"></div></section><footer class="footer">Draft preview · close this tab to return to CMS</footer></div><script>
const c=JSON.parse(sessionStorage.getItem("portfolio_cms_preview")||"null"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));if(!c){document.body.innerHTML='<div class="empty">No preview data found. Open preview from the CMS.</div>'}else{document.querySelector("#badge").textContent=c.hero?.badge||"";document.querySelector("#lead").textContent=c.hero?.lead||"";document.querySelector("#accent").textContent=c.hero?.accent||"";document.querySelector("#tail").textContent=c.hero?.tail||"";document.querySelector("#desc").textContent=c.hero?.description||"";document.querySelector("#nav").innerHTML=(c.navigation||[]).map(x=>'<a href="#">'+esc(x.label)+'</a>').join("");document.querySelector("#projects").innerHTML=(c.projects||[]).filter(x=>x.enabled!==false).map(x=>'<article class="card">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<small>'+esc(x.status||"published")+' · '+esc(x.category||"Project")+'</small><h2>'+esc(x.title)+'</h2><p>'+esc(x.description||"")+'</p></article>').join("");document.querySelector("#posts").innerHTML=(c.posts||[]).filter(x=>x.enabled!==false).map(x=>'<article class="card"><small>'+esc(x.status||"published")+' · '+esc(x.date||"Writing")+'</small><h2>'+esc(x.title)+'</h2><p>'+esc(x.excerpt||"")+'</p></article>').join("");document.querySelector("#experience").innerHTML=(c.experience||[]).filter(x=>x.enabled!==false).map(x=>'<article class="card"><small>'+esc(x.status||"published")+' · '+esc(x.period||"")+'</small><h2>'+esc(x.role)+'</h2><p><b>'+esc(x.organization||"")+'</b></p><p>'+esc(x.description||"")+'</p></article>').join("")}
</script></body></html>
